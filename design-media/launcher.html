<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central Piedmont Degree Explorer</title>
  <link rel="icon" href="tech/assets/brand/mark-gold.png">
  <style>
    @font-face{font-family:'Libre Franklin';font-weight:100 900;src:url('tech/assets/fonts/LibreFranklin.ttf') format('truetype');}
    :root{--gold:#B4A269;--gray:#54565A;--ink:#151617;--mist:#EFEFEF;}
    *{box-sizing:border-box;margin:0;}
    body{font-family:'Franklin Gothic URW','Libre Franklin',Arial,sans-serif;color:var(--ink);background:#fff;}
    header{display:flex;align-items:center;gap:24px;padding:18px 32px;border-bottom:1px solid #D4D5D6;}
    header img{height:56px;}
    .hero{background:var(--mist);padding:56px 32px 40px;}
    .hero h1{font-size:48px;font-weight:500;color:var(--gray);}
    .hero p{font-size:20px;margin-top:10px;max-width:720px;line-height:1.45;}
    main{max-width:1240px;margin:40px auto;padding:0 32px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
    a.card .b{flex:1;}
    a.card{display:flex;flex-direction:column;background:var(--gold);color:var(--ink);text-decoration:none;overflow:hidden;transition:transform .12s;}
    a.card:hover{transform:translateY(-4px);}
    a.card .b{padding:24px 24px 18px;}
    a.card h2{font-size:24px;font-weight:500;}
    a.card p{margin-top:8px;font-size:16px;line-height:1.4;}
    a.card .go{display:block;margin-top:14px;font-weight:600;}
    a.card .ph{height:170px;background-size:cover;background-position:center;clip-path:polygon(0 0,100% 18%,100% 100%,0 100%);}
    footer{background:var(--gray);color:#fff;padding:32px;font-size:15px;}
    @media(max-width:900px){main{grid-template-columns:1fr 1fr;}}
    @media(max-width:560px){main{grid-template-columns:1fr;} .hero h1{font-size:34px;}}
  </style>
</head>
<body>
  <header><img src="tech/assets/brand/logo-color.svg" alt="Central Piedmont Community College"></header>
  <section class="hero"><h1>Degree Explorer</h1><p>Touchscreen program finders for advising days, open houses, and career fairs. Choose a kiosk to open it.</p></section>
  <main>
<!--CARDS-->
  </main>
  <footer>Central Piedmont Community College &middot; 1201 Elizabeth Avenue, Charlotte, NC 28204</footer>
</body>
</html>
